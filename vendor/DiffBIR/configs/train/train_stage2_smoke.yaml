# Stage-2 fine-tune：条件 = NAFNet stage1 输出（对齐部署），目标 = 干净 gt。
# 训练从 DiffBIR_v2.1.pt（当前部署 controlnet）继续，消除 NAFNet 条件下的幻觉。
model:
  cldm:
    target: diffbir.model.cldm.ControlLDM
    params:
      latent_scale_factor: 0.18215
      unet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64 # need to fix for flash-attn
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: "penultimate"
      controlnet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        hint_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64 # need to fix for flash-attn
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False
  swinir:
    target: diffbir.model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: "nearest+conv"
      resi_connection: "1conv"
      unshuffle: True
      unshuffle_scale: 8
  diffusion:
    target: diffbir.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000
      zero_snr: True
      parameterization: v

dataset:
  train:
    target: diffbir.dataset.synth_ft.SynthFtDataset
    params:
      pairs_root: /home/liaitong/hw_comp/dataset/syn4k/train
      cond_root: /home/liaitong/hw_comp/dataset/syn4k/cond
      out_size: 512
      crop_type: random

batch_transform:
  target: diffbir.dataset.batch_transform.IdentityBatchTransform

train:
  sd_path: /home/liaitong/hw_comp/vendor/DiffBIR/weights/sd2.1-base-zsnr-laionaes5.ckpt
  exp_dir: /home/liaitong/hw_comp/checkpoints/stage2_smoke
  swinir_path: /home/liaitong/hw_comp/vendor/DiffBIR/weights/realesrgan_s4_swinir_100k.pth
  learning_rate: 2e-5  # 安全区：stage1 教训 1e-4 会推出稳定态
  batch_size: 2
  num_workers: 2
  train_steps: 4
  log_every: 1
  ckpt_every: 999999
  image_every: 999999
  resume: /home/liaitong/hw_comp/vendor/DiffBIR/weights/DiffBIR_v2.1.pt
  noise_aug_timestep: 0
