[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enhance"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "numpy",
    "opencv-python",
    "scikit-image",
    "torch",
    "diffusers>=0.24,<0.30",
    "transformers",
    "accelerate",
    "safetensors",
    "pyiqa",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
