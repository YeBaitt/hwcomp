data:
  root: dataset  # 预留（未消费）：训练数据根目录，下游未读取
  image_pairs_train_dir: dataset/div8k_syn/train  # DIV8K 全量 1500 对：标定退化（σ2.5-5 blur + 噪声 + jpeg），4096 长边对齐部署 4K
  val_dir: dataset/huawei/val
  test_dir: dataset/huawei/test
output:
  out_root: output
  ckpt_root: checkpoints
  submit_dir: output_dir
  zip_path: my_work.zip
training:
  patch_size: 512
  batch_size: 2
  grad_accum: 2  # patch 512 下 batch 2 显存安全；累积 2 步 = 等效 batch 4，与旧配方可比
  num_workers: 2  # DataLoader worker 会 fork 主进程并各自持有 LRU 缓存副本，必须调小
  seed: 42
  kind_2k_weight: 0.7
  stage1_epochs: 60
  stage1_lr: 2e-5  # 微调稳定 LR：实测 1e-4 会把已适配模型推出稳定态（val 24.69→22.60），2e-5 为安全区
  warmup_epochs: 3
  early_stop_patience: 8
  val_holdout_n: 10
  cache_root: dataset/div8k_syn/cache
  cache_pairs: 4  # 每 worker 缓存峰值 ~cache_pairs*240MB；4 对 ≈1GB，避免整机 OOM
  length_factor: 1  # 每对图像每 epoch 的采样次数；全量 8584 对下取 1 即可保证多样性
inference:
  tile_size: 512
  overlap: 128
  steps: 20
  scheduler: dpm  # 预留（未消费）：采样器类型，下游未读取
  batch_tiles: 8  # 预留（未消费）：批分块数，下游未读取
  use_tta: false  # 预留（未消费）：TTA 开关，下游未读取
model:
  # 从已训最优 stage1 checkpoint 续训（val PSNR 23.258，epoch 2 后保存）
  stage1_pretrained: checkpoints/stage1_best.pth
knobs:
  # 8/15 验证：LF 低频锚定（beta）为 Pareto 改进——5 图均值 PSNR 25.79→27.02（追平原图 27.35），
  # NIQE 5.22 不掉、SSIM/锐度全部不倒退。σ=8/16/32 几乎无差。α=1.0 严格优于 0.5。
  # 候选提交口径：lam=0.2 alpha=1.0 beta=1.0 sigma=8；感知向可调 lam=0.4/alpha=1.0。
  lam: 0.2
  n: 0.15
  w: 2.0
  alpha: 1.0
  beta: 1.0
  sigma: 8.0
