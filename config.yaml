data:
  root: dataset
  image_pairs_train_dir: dataset/ImagePairs/train
  val_dir: dataset/huawei/val
  test_dir: dataset/huawei/test
output:
  out_root: output
  ckpt_root: checkpoints
  submit_dir: output_dir
  zip_path: my_work.zip
training:
  patch_size: 256
  batch_size: 2
  num_workers: 4
  seed: 42
  kind_2k_weight: 0.7
  stage1_epochs: 30
inference:
  tile_size: 512
  overlap: 128
  steps: 20
  scheduler: dpm
  batch_tiles: 8
  use_tta: false
model:
  stage1_pretrained: vendor/NAFNet/weights/NAFNet-SIDD-width64.pth
knobs:
  # Task 11 val 网格调优推荐（PSNR 24.505/SSIM 0.739/NIQE 4.201）：λ=0.2 陡沿后保持大部分感知增益且 PSNR 仅 -0.29dB；
  # α=0.5 高频回注几乎免费 +0.09dB。仅改 lam/alpha，n/w 沿用配置。
  lam: 0.2
  n: 0.15
  w: 2.0
  alpha: 0.5
