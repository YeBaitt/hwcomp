data:
  root: dataset
  image_pairs_train_dir: dataset/ImagePairs/train
  val_dir: dataset/huawei/val
  test_dir: dataset/huawei/test
output:
  out_root: output
  ckpt_root: checkpoints
  submit_dir: output_dir
  zip_path: my_work.zip
training:
  patch_size: 256
  batch_size: 2
  num_workers: 4
  seed: 42
  kind_2k_weight: 0.7
  stage1_epochs: 30
inference:
  tile_size: 512
  overlap: 128
  steps: 20
  scheduler: dpm
  batch_tiles: 8
  use_tta: false
model:
  stage1_pretrained: vendor/NAFNet/weights/NAFNet-SIDD-width64.pth
knobs:
  lam: 0.3
  n: 0.15
  w: 2.0
  alpha: 0.4
