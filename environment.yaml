# hwcomp 训练/推理环境（对齐 2026-08-16 开发机：RTX 4090 24GB, CUDA 12.1, Python 3.12）
#
# 创建：
#   conda env create -f environment.yaml
#   conda activate hwcomp
#   pip install -e .                # 安装本项目（src layout，含 pyproject.toml 依赖）
#   bash scripts/download_weights.sh # 下载 NAFNet / DiffBIR 预训练权重
#
# 注：torch==2.2.0 在 Linux 上默认拉取 cu121 轮（含捆绑的 CUDA 运行库），
#     只需系统驱动 >= 525；若拉成 CPU 版，手动指定：
#     pip install torch==2.2.0 torchvision==0.17.0 --index-url https://download.pytorch.org/whl/cu121
name: hwcomp
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # ---- 数值/图像基础 ----
      - numpy==1.26.4
      - PyYAML==6.0.3
      - opencv-python==4.11.0.86
      - scikit-image==0.26.0
      - scipy==1.17.1
      - pillow==12.3.0
      - tqdm==4.70.0

      # ---- 深度学习框架（对齐 torch 2.2.0+cu121）----
      - torch==2.2.0
      - torchvision==0.17.0

      # ---- 扩散 / ControlNet 相关（DiffBIR 依赖）----
      - diffusers==0.29.2
      - transformers==4.40.2
      - accelerate==0.33.0
      - safetensors==0.8.0
      - omegaconf==2.3.1
      - einops==0.8.2
      - torchsde==0.2.6
      - openai-clip==1.0.1
      - facexlib==0.3.0
      - timm==1.0.28
      - tensorboard==2.21.0

      # ---- NAFNet / basicsr 依赖 ----
      - addict==2.4.0
      - future==1.0.0
      - lmdb==2.3.0
      - yapf==0.43.0

      # ---- 指标 / 测试 / 工具 ----
      - pyiqa==0.1.15.post2
      - pytest==9.1.1
